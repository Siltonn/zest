name: Release images

# Tags only. Building on every push to main would spend CI on an artifact nobody
# asked for; a release is the moment someone wants something pullable.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Extra tag to publish as (e.g. v0.1.0). Optional."
        required: false

permissions:
  contents: read
  # The whole reason GHCR needs no account, no PAT and no repository secret: the
  # token the runner already has can push, once the job asks for it.
  packages: write

env:
  # ghcr.io rejects an uppercase path and this repository's owner has one, so the
  # name is lowercased per job rather than taken from github.repository verbatim.
  REGISTRY: ghcr.io

jobs:
  # Each architecture builds on a runner of that architecture. The obvious
  # alternative — one job emitting both platforms through QEMU — costs far more
  # than the usual "emulation is a few times slower": the heavy steps here are
  # pnpm install and tsc, so the thing being emulated is Node, and QEMU handles
  # a JIT that writes its own machine code worse than it handles static code.
  # Two native jobs also run in parallel, so the wall clock is one build, not two.
  build:
    strategy:
      # A failed web build should not discard a good server build that took just
      # as long, and one architecture failing should still leave the other's
      # digest to look at.
      fail-fast: false
      matrix:
        # Spelled out rather than crossed, because the runner is a function of
        # the platform and the dockerfile is a function of the image — a product
        # of two axes plus `include` reads as if it should work and does not.
        include:
          - { image: server, dockerfile: apps/server/Dockerfile, platform: linux/amd64, runner: ubuntu-latest }
          - { image: server, dockerfile: apps/server/Dockerfile, platform: linux/arm64, runner: ubuntu-24.04-arm }
          - { image: web, dockerfile: apps/web/Dockerfile, platform: linux/amd64, runner: ubuntu-latest }
          - { image: web, dockerfile: apps/web/Dockerfile, platform: linux/arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve names
        run: |
          echo "IMAGE=${REGISTRY}/${GITHUB_REPOSITORY,,}-${{ matrix.image }}" >> "$GITHUB_ENV"
          echo "PLATFORM_KEY=${{ matrix.platform }}" | tr '/' '-' >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}

      # Pushed by digest, not by tag: a tag can only point at one manifest, and
      # the two architectures are not finished until the merge job says so.
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.image }}-${{ env.PLATFORM_KEY }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ env.PLATFORM_KEY }}

      # The filename is the bare digest, prefix stripped: the merge job rebuilds
      # the reference as `image@sha256:<name>`, so leaving `sha256:` on would
      # produce `image@sha256:sha256:…` and fail there rather than here.
      - name: Hand the digest to the merge job
        run: |
          digest='${{ steps.build.outputs.digest }}'
          mkdir -p /tmp/digests
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.image }}-${{ env.PLATFORM_KEY }}
          path: /tmp/digests/*
          retention-days: 1

  # One manifest list per image, pointing at both architecture digests. This is
  # what makes `docker pull` resolve to the right one on the puller's machine.
  merge:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [server, web]
    steps:
      - name: Resolve name
        run: echo "IMAGE=${REGISTRY}/${GITHUB_REPOSITORY,,}-${{ matrix.image }}" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.image }}-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # Three kinds on purpose. `latest` is what a copied compose file names;
          # the semver pair lets someone pin a minor and still take patches; the
          # sha is what you reach for when a release is bad and the only question
          # is which commit it was.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}
            type=sha,format=long

      - name: Create the manifest list
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "${IMAGE}@sha256:%s " *)

      - name: Show what landed
        run: docker buildx imagetools inspect "${IMAGE}:${{ steps.meta.outputs.version }}"
