packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  # drizzle-kit runs esbuild to load drizzle.config.ts
  esbuild: true
  # optional native msgpack acceleration for BullMQ job payloads
  msgpackr-extract: true
  # ESLint's module resolver. Its postinstall only exists to fetch a native
  # binding when pnpm failed to install the platform's optional dependency —
  # which pnpm does install — so there is nothing for the script to do.
  unrs-resolver: false
minimumReleaseAgeExclude:
  - '@mastra/core@1.60.0'
  - '@mastra/deployer@1.60.0'
  - '@mastra/memory@1.27.0'
  - '@mastra/observability@1.17.1'
  - '@mastra/pg@1.21.0'
  - '@mastra/server@1.60.0'
  - mastra@1.25.1
