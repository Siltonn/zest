services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: zest
      POSTGRES_PASSWORD: zest
      POSTGRES_DB: zest
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zest"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Catches outbound mail in development so approval notifications are visible
  # at http://localhost:8025 without configuring a real provider.
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
      - "1025:1025"

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    # One container runs both roles. Scale out later by starting this same
    # image twice with MODE=api and MODE=worker.
    environment:
      MODE: all
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgres://zest:zest@postgres:5432/zest
      REDIS_URL: redis://redis:6379
      ZEST_ENCRYPTION_KEY: ${ZEST_ENCRYPTION_KEY:-dev-encryption-key-change-me}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-dev-auth-secret-change-me}
      BETTER_AUTH_URL: http://localhost:4000
      WEB_URL: http://localhost:3000
      DEMO_MODE: ${DEMO_MODE:-true}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      ZEST_MODEL: ${ZEST_MODEL:-}
      MAIL_PROVIDER: ${MAIL_PROVIDER:-smtp}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      MAIL_FROM: ${MAIL_FROM:-Zest <zest@localhost>}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      NODE_ENV: production
      SERVER_URL: http://server:4000
    ports:
      - "3000:3000"
    depends_on:
      - server

volumes:
  postgres-data:
